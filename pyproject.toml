[project]
name = "pyevio"
dynamic = ["version"]
description = "A Python EVIO parsing library and CLI."
authors = [
    { name = "Dmitry Romanov", email = "romanovda@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "lz4>=4.4.0",
    "rich",
    "numpy",
    "matplotlib",
    "textual"
]


[project.optional-dependencies]
test = ["pytest"]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

# uv installs the dev group by default, so `uv run pytest` works without extras.
[dependency-groups]
dev = [
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "playwright>=1.60.0",
    "pyarrow>=21.0.0",
    "pytest",
    "pyyaml>=6.0.3",
    "uvicorn>=0.39.0",
]


[build-system]
requires = ["setuptools", "wheel", "build", "twine"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "pyevio.__version__"}

# Only the library is a package; docs/, examples/, space/ and tests/ sit
# beside it in a flat layout and must not be discovered as packages.
[tool.setuptools.packages.find]
include = ["pyevio*"]

[project.scripts]
pyevio = "pyevio.cli:main"

[tool.pytest.ini_options]
markers = [
    "slow: scans multi-gigabyte files; tests/golden/test_corpus.py runs only with PYEVIO_CORPUS=1",
]

[tool.setuptools.package-data]
pyevio = ["web/*.html", "web/*.js", "web/*.css"]
